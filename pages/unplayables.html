<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNPLAYABLES</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ebebe8;
            margin: 0;
            min-height: 96vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: #ffffff;
        }
        main {
            flex: 1;
            font-size: 200%;
            margin-top: 0;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin: 20px 0 30px;
        }
        h1 {
            margin: 0;
        }
        .button {
            padding: 37.5px 105px;
            border-radius: 75px;
            cursor: pointer;
            border: 0;
            background-color: white;
            box-shadow: rgb(0 0 0 / 5%) 0 0 12px;
            letter-spacing: 4.5px;
            text-transform: uppercase;
            font-size: 22.5px;
            transition: all 0.5s ease;
            text-decoration: none;
            color: rgb(0, 0, 0);
            }

            .button:hover {
            letter-spacing: 6.75px;
            background-color: #007bff;
            color: hsl(0, 0%, 100%);
            box-shadow: #0053ab 0px 10.5px 43.5px 0px;
            }

            .button:active {
            letter-spacing: 4.5px;
            background-color: #007bff;
            color: hsl(0, 0%, 100%);
            box-shadow: #007bff 0px 0px 0px 0px;
            transform: translateY(15px);
            transition: 100ms;
            }
        a {
            color: #00b3ff;
        }
        .site-footer {
            padding: 34px 10px;
            color: #ffffff;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .logo {
            font-size: 200%;
            color: #11c7ff;
            font-family: 'Courier New', Courier, monospace, sans-serif; 
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="page-header">
        </div>
    </main>
    <footer class="site-footer">
        <a href="../index.html" class="button">Return</a>
    </footer>
</body>
</html>
