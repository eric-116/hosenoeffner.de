<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Secret Codes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2e2e2e;
            margin: 0;
            min-height: 96vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: #ffffff;
        }
        main {
            flex: 1;
            font-size: 200%;
            margin-top: 0;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin: 20px 0 30px;
        }
        h1 {
            margin: 0;
        }
        .button {
            padding: 25px 70px;
            border-radius: 50px;
            cursor: pointer;
            border: 0;
            background-color: white;
            box-shadow: rgb(0 0 0 / 5%) 0 0 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 150%;
            transition: all 0.5s ease;
            text-decoration: none;
            color: rgb(0, 0, 0);
            }

            .button:hover {
            letter-spacing: 4.5px;
            background-color: #007bff;
            color: hsl(0, 0%, 100%);
            box-shadow: #0053ab 0px 7px 29px 0px;
            }

            .button:active {
            letter-spacing: 3px;
            background-color: #007bff;
            color: hsl(0, 0%, 100%);
            box-shadow: #007bff 0px 0px 0px 0px;
            transform: translateY(10px);
            transition: 100ms;
            }
        .input {
            display: inline-block;
            padding: 25px 85px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 50px;
            font-size: 150%;
            margin-right: 10px;
        }
        
        a {
            color: #00b3ff;
        }
        .site-footer {
            padding: 12px 0;
            color: #ffffff;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .logo {
            font-size: 200%;
            color: #11c7ff;
            font-family: 'Courier New', Courier, monospace, sans-serif; 
            text-decoration: none;
        }
        .align-center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
        }
        .anchored {
            position: fixed;
            bottom: 40px;
            left: 40px;
        }
    </style>
</head>
    <a href="../index.html"><img src="../images/logo.png" alt="Hosenöffner Logo" style="width: 700px; position: fixed; right: 20px; top: 20px;"></a>
<body>
    <form class="align-center">
        <input type="text" id="codeInput" placeholder="Enter secret code..." class="input">
        <input type="submit" id="submitCode" value="Submit Code" class="button" styles="margin-left: 40px;">
    </form>
    <div class="anchored"><a href="../index.html" class="button" style="font-size: 100%;">Return</a></div>
    <script src="../codes.js"></script>
</body>
</html>
